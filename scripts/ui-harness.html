      class FakeSdk {
        constructor() {
          this.listeners = new Map();
          this.core = {
            isOnHold: false,
            bindAudioElements: () => {},
            emit: (eventName, payload) => this.emit(eventName, payload)
          };
          this.calls = [];
          this.hangups = 0;
          this.mutes = 0;
          this.holds = 0;
          this.resumes = 0;
          this.muted = false;
          this.dtmfs = [];
          this.transfers = [];
          this.conferences = [];
          this.deviceSwitches = [];
          this.registers = 0;
          this.unregisters = 0;
          this.answers = 0;
          this.rejects = [];
        }

        on(eventName, handler) {
          if (!this.listeners.has(eventName)) this.listeners.set(eventName, new Set());
          this.listeners.get(eventName).add(handler);
          return () => this.off(eventName, handler);
        }

        off(eventName, handler) {
          this.listeners.get(eventName)?.delete(handler);
        }

        emit(eventName, payload) {
          for (const handler of this.listeners.get(eventName) || []) handler(payload);
        }

        async register() {
          this.registers += 1;
          this.emit("registration-changed", { online: true, user: "1001" });
          return { online: true };
        }

        async unregister() {
          this.unregisters += 1;
          this.emit("registration-changed", { online: false });
        }

        async toggleRegistration() {
          return this.register();
        }

        getRegistrationState() {
          return { online: false };
        }

        async call(target, options = {}) {
          this.calls.push({ target, options });
          this.emit("outgoing-call", { target });
        }

        async answer() {
          this.answers += 1;
          this.emit("call-connected", { direction: "incoming" });
        }

        async reject(options = {}) {
          this.rejects.push(options);
          this.emit("call-ended");
        }

        hangup() {
          this.hangups += 1;
          this.emit("call-ended");
        }

        mute() {
          this.mutes += 1;
          this.muted = !this.muted;
          this.emit("mute-changed", { muted: this.muted });
          return this.muted;
        }

        async hold() {
          this.holds += 1;
          this.core.isOnHold = true;
          this.emit("hold-changed", { onHold: true });
        }

        async resume() {
          this.resumes += 1;
          this.core.isOnHold = false;
          this.emit("hold-changed", { onHold: false });
        }

        async reconnect() {}

        async transfer(target) {
          this.transfers.push(target);
        }

        async conference(target) {
          this.conferences.push(target);
        }

        async listDevices() {
          return [
            { kind: "audioinput", deviceId: "mic-1", label: "Mic 1" },
            { kind: "videoinput", deviceId: "cam-1", label: "Camera 1" },
            { kind: "audiooutput", deviceId: "speaker-1", label: "Speaker 1" }
          ];
        }

        async switchDevice(kind, deviceId) {
          this.deviceSwitches.push({ kind, deviceId });
        }

        async sendDTMF(digits) {
          this.dtmfs.push(digits);
        }
      }

      async function runCoreBehaviorTest() {
        const audioTrack = { enabled: true, stopped: false, stop() { this.stopped = true; } };
        const stream = {
          getAudioTracks: () => [audioTrack],
          getVideoTracks: () => [],
          getTracks: () => [audioTrack],
          addTrack: () => {},
          removeTrack: () => {}
        };
        class FakeMediaManager extends MediaManager {
          async getLocalStream() {
            this.localStream = stream;
            this.emit("local-stream", stream);
            return stream;
          }
        }
        const core = new PhoneCore({}, { SIP: { SessionState: { Established: "established", Terminated: "terminated" } }, mediaManager: new FakeMediaManager({ mediaDevices: {} }) });
        await core.media.getLocalStream();
        const events = [];
        core.on("mute-changed", (event) => events.push(event.muted));
        const first = core.mute();
        const afterFirst = audioTrack.enabled;
        const second = core.mute();
        const afterSecond = audioTrack.enabled;
        return {
          pass: first === true && second === false && afterFirst === false && afterSecond === true && JSON.stringify(events) === JSON.stringify([true, false]),
          first,
          second,
          afterFirst,
          afterSecond,
          events
        };
      }

          const uiBindings = await runUiBindingTest();
          const coreBehavior = await runCoreBehaviorTest();
          resultEl.dataset.status = uiBindings.pass && coreBehavior.pass ? "pass" : "fail";
          resultEl.textContent = JSON.stringify({ uiBindings, coreBehavior }, null, 2);
        } catch (error) {
          resultEl.dataset.status = "fail";
          resultEl.textContent = JSON.stringify({ error: String(error?.message || error) }, null, 2);
        }
      }

      window.__VPhoneHarness = { phone, sdk, runUiBindingTest, runCoreBehaviorTest };
      maybeAutorunSelfTest();
    </script>
  </body>
</html>
