<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPhone — Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --border: #334155;
      --input: #0b1220;
      --ok: #22c55e;
      --err: #f87171;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(14, 165, 233, 0.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(56, 189, 248, 0.12), transparent 50%),
        var(--bg);
    }
    .wrap {
      box-sizing: border-box;
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 120px;
    }
    .wrap *, .wrap *::before, .wrap *::after { box-sizing: border-box; }
    .wrap h1 {
      margin: 0 0 6px;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .wrap .lead {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
    }
    .wrap .panel {
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .wrap .panel h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      font-weight: 600;
    }
    .wrap label {
      display: block;
      margin: 0 0 6px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .wrap .field { margin-bottom: 14px; }
    .wrap input, .wrap textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--input);
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
    }
    .wrap textarea { min-height: 88px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 0.9rem; }
    .wrap .hint { margin: 6px 0 0; font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
    .wrap .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .wrap button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .wrap .btn-primary { background: var(--accent); color: #04111a; }
    .wrap .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    .wrap #status {
      margin-top: 14px;
      min-height: 1.4em;
      font-size: 0.9rem;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .wrap #status.ok { color: var(--ok); }
    .wrap #status.err { color: var(--err); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>VPhone demo</h1>
    <p class="lead">
      Host lấy cấu hình máy nhánh (giả lập fetch), mount widget floating, gọi bằng <code>makeCall</code>.
      Có thể ghi đè SIP qua query/hash: <code>?Server=…&amp;Username=…&amp;Password=…</code>
    </p>

    <section class="panel">
      <h2>Gọi đi</h2>
      <form id="call-form">
        <div class="field">
          <label for="number">Số điện thoại / máy nhánh</label>
          <input id="number" name="number" type="tel" inputmode="tel" placeholder="1002 hoặc 0901234567" required>
        </div>
        <div class="field">
          <label for="headers">Custom headers gửi kèm INVITE (mỗi dòng một header)</label>
          <textarea id="headers" name="headers" placeholder="X-Department: Support&#10;X-Ticket-ID: 12345&#10;X-Source: web-demo">X-Source: web-demo
X-Department: Support</textarea>
          <p class="hint">Định dạng <code>Name: value</code>. Widget cũng lắng <code>IncomingHeaders</code> khi có cuộc gọi đến.</p>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary" id="btn-call">Gọi</button>
        </div>
        <div id="status" role="status"></div>
      </form>
    </section>
  </div>

  <script src="../../lib/vphone.min.js"></script>
  <script>
    (function () {
      var phone = null;
      var statusEl = document.getElementById("status");

      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.className = kind || "";
      }

      /**
       * Simulate host app after login:
       *   const sip = await fetch('/api/me/phone').then((r) => r.json());
       * Only pass fields that differ from library defaults.
       */
      function fetchPhoneConfigFromBackend() {
        var cfg = {
          EnableNotifications: true,
          profileName: "hungmv",
          Server: "v9.sip.tongdai.io.vn",
          Port: 4443,
          Domain: "v9.sip.tongdai.io.vn",
          Username: "7001",
          Password: "rdaNKE*H+58r42o~",
          // Headers to surface on incoming INVITE
          IncomingHeaders: ["From", "X-Ticket-ID", "X-Department"]
        };

        try {
          var raw = (location.hash || "").replace(/^#/, "") || (location.search || "").replace(/^\?/, "");
          if (raw) {
            var params = new URLSearchParams(raw);
            ["Server", "Port", "ServerPath", "Domain", "Username", "Password", "PasswordType", "profileName"].forEach(function (key) {
              if (params.has(key)) cfg[key] = params.get(key);
            });
          }
        } catch (e) {}

        return Promise.resolve(cfg);
      }

      function parseHeaders(raw) {
        return String(raw || "")
          .split(/\r?\n/)
          .map(function (line) { return line.trim(); })
          .filter(Boolean)
          .map(function (line) {
            if (line.indexOf(":") === -1) return line;
            var parts = line.split(":");
            var name = parts.shift().trim();
            var value = parts.join(":").trim();
            return name + ": " + value;
          });
      }

      function formatIncoming(payload) {
        var lines = ["Cuộc gọi đến"];
        if (payload.displayName) lines.push("Tên: " + payload.displayName);
        if (payload.number) lines.push("Số: " + (payload.number));
        var headers = payload.headers || {};
        Object.keys(headers).forEach(function (name) {
          lines.push(name + ": " + headers[name]);
        });
        return lines.join("\n");
      }

      function mountPhone(sipConfig) {
        if (phone && typeof phone.destroy === "function") {
          try { phone.destroy(); } catch (e) {}
          phone = null;
        }

        phone = Vphone.mount({
          floating: true,
          title: "VPhone",
          config: sipConfig,
        //   collapseOnCallEnd: false,
          onStatusChange: function (payload) {
            if (!payload) return;
            if (payload.status === "online" || payload.online) setStatus("Đã sẵn sàng gọi", "ok");
            else if (payload.status === "offline") setStatus("Đã hủy đăng ký (offline)", "");
            else setStatus(payload.error ? String(payload.error) : "Đăng ký thất bại", "err");
          },
          onCredentialsRequired: function () {
            return fetchPhoneConfigFromBackend();
          },
          onCallEvent: function (payload) {
            if (!payload) return;
            if (payload.phase === "incoming") setStatus(formatIncoming(payload), "ok");
            if (payload.phase === "outgoing") setStatus("Đang gọi " + (payload.number || ""), "ok");
            if (payload.phase === "ended") setStatus("Cuộc gọi kết thúc", "");
          }
        });

        setStatus("Widget đã load (thu nhỏ). Gọi đến hoặc bấm Gọi sẽ tự mở.", "ok");
        return phone;
      }

      document.getElementById("call-form").addEventListener("submit", function (event) {
        event.preventDefault();
        if (!phone) {
          setStatus("Widget chưa sẵn sàng.", "err");
          return;
        }
        var number = document.getElementById("number").value.trim();
        var extraHeaders = parseHeaders(document.getElementById("headers").value);
        if (!number) {
          setStatus("Nhập số cần gọi.", "err");
          return;
        }
        var ok = phone.makeCall(number, {
          extraHeaders: extraHeaders.length ? extraHeaders : null
        });
        if (ok) setStatus("Đang gọi " + number, "ok");
        else setStatus("Không gửi được lệnh gọi (kiểm tra widget / số).", "err");
      });

      setStatus("Đang lấy cấu hình máy nhánh…", "");
      fetchPhoneConfigFromBackend().then(function (sipConfig) {
        mountPhone(sipConfig);
      }).catch(function (err) {
        setStatus("Không lấy được cấu hình: " + (err && err.message ? err.message : err), "err");
      });
    })();
  </script>
</body>
</html>
