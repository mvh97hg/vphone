<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VPhone Src Harness</title>
    <link rel="stylesheet" href="./styles/phone-ui.css" />
  </head>
  <body>
    <div id="phone-root"></div>
    <pre id="self-test-result" data-status="idle"></pre>
    <script type="module">
      import { createModularPhone } from "./create-modular-phone.js";
      import { MediaManager } from "../core/media-manager.js";

      class FakePeerConnection {
        static created = 0;
        static closed = 0;
        constructor() {
          FakePeerConnection.created += 1;
          this.senders = [];
          this.remoteDescription = null;
          this.localDescription = null;
          this.onicecandidate = null;
          this.ontrack = null;
        }
        createOffer() { return Promise.resolve({ type: "offer", sdp: "fake-offer" }); }
        createAnswer() { return Promise.resolve({ type: "answer", sdp: "fake-answer" }); }
        setLocalDescription(desc) { this.localDescription = desc; return Promise.resolve(); }
        setRemoteDescription(desc) { this.remoteDescription = desc; return Promise.resolve(); }
        addIceCandidate() { return Promise.resolve(); }
        getSenders() { return this.senders; }
        addTrack(track, stream) { const sender = { track, stream }; this.senders.push(sender); return sender; }
        close() { FakePeerConnection.closed += 1; }
      }

      class FakeMediaManager extends MediaManager {
        async getLocalStream() {
          this.localStream = new MediaStream();
          this.emit("local-stream", this.localStream);
          return this.localStream;
        }
      }

      const fakeSignaling = {
        sendOffer: async () => {},
        sendAnswer: async () => {},
        sendIceCandidate: async () => {},
        sendControl: async () => {}
      };

      const phone = createModularPhone({
        root: document.getElementById("phone-root"),
        deps: {
          PeerConnection: FakePeerConnection,
          mediaManager: new FakeMediaManager({ mediaDevices: {} }),
          signaling: fakeSignaling
        }
      });

      function snapshotCoreListeners(core) {
        const snapshot = {};
        for (const [eventName, set] of core.listeners.entries()) snapshot[eventName] = set.size;
        return snapshot;
      }

      async function runSelfTest(iterations = 5) {
        const baselineListeners = snapshotCoreListeners(phone.core);
        const baselineCreated = FakePeerConnection.created;
        const baselineClosed = FakePeerConnection.closed;
        for (let i = 0; i < iterations; i += 1) {
          await phone.core.call("1002");
          await phone.core.hold();
          await phone.core.resume();
          await phone.core.reconnect();
          phone.core.hangup();
          if (phone.core.peers && phone.core.peers.pc !== null) throw new Error("PeerConnection not cleaned up");
          if (phone.core.media.localStream !== null) throw new Error("Local stream not cleaned up");
        }
        const afterListeners = snapshotCoreListeners(phone.core);
        return {
          iterations,
          listenersStable: JSON.stringify(baselineListeners) === JSON.stringify(afterListeners),
          peersBalanced: (FakePeerConnection.created - baselineCreated) === (FakePeerConnection.closed - baselineClosed),
          createdDelta: FakePeerConnection.created - baselineCreated,
          closedDelta: FakePeerConnection.closed - baselineClosed
        };
      }

      async function runUiBindingTest() {
        const flush = () => new Promise((resolve) => setTimeout(resolve, 0));
        const dialText = document.getElementById("dialText");
        const btnFreeDial = document.getElementById("BtnFreeDial");
        const btnDialAudio = document.getElementById("dialAudio");
        const btnDialVideo = document.getElementById("dialVideo");
        const btnDigit1 = document.querySelector("[data-dial-digit='1']");
        const btnDelete = document.getElementById("dialDeleteKey");
        if (!dialText || !btnFreeDial || !btnDialAudio || !btnDialVideo) {
          return { pass: false, reason: "Missing expected dialpad controls in src/ui template" };
        }

        const baselineCreated = FakePeerConnection.created;
        const baselineClosed = FakePeerConnection.closed;
        let outgoingCount = 0;
        let lastOutgoingOptions = null;
        const onOutgoing = () => {
          outgoingCount += 1;
        };
        const onCallState = ({ state, nextState, context }) => {
          if ((nextState || state) !== "outgoing") return;
          lastOutgoingOptions = context?.options || null;
        };
        phone.core.on("outgoing-call", onOutgoing);
        phone.core.on("call-state", onCallState);

        dialText.value = "1002";
        btnFreeDial.click();
        await flush();
        phone.core.hangup();
        btnDialAudio.click();
        await flush();
        phone.core.hangup();
        btnDialVideo.click();
        await flush();
        phone.core.hangup();

        // Dialpad behavior checks (digit append + delete + enter call)
        dialText.value = "";
        if (btnDigit1) btnDigit1.click();
        const afterDigit = dialText.value;
        if (btnDelete) btnDelete.click();
        const afterDelete = dialText.value;
        dialText.value = "1002";
        const enterEvent = new KeyboardEvent("keydown", { key: "Enter", ctrlKey: true, bubbles: true, cancelable: true });
        dialText.dispatchEvent(enterEvent);
        await flush();
        phone.core.hangup();

        phone.core.off("outgoing-call", onOutgoing);
        phone.core.off("call-state", onCallState);

        return {
          pass: outgoingCount === 4 && afterDigit === "1" && afterDelete === "" && !!(lastOutgoingOptions && lastOutgoingOptions.video === true),
          outgoingCount,
          expectedOutgoingCount: 4,
          afterDigit,
          afterDelete,
          lastOutgoingOptions,
          peerCreatedDelta: FakePeerConnection.created - baselineCreated,
          peerClosedDelta: FakePeerConnection.closed - baselineClosed
        };
      }

      async function maybeAutorunSelfTest() {
        const resultEl = document.getElementById("self-test-result");
        const params = new URLSearchParams(window.location.search);
        if (params.get("autorun") !== "1") return;
        try {
          const result = await runSelfTest(Number(params.get("iterations") || "5"));
          const uiBindings = await runUiBindingTest();
          resultEl.dataset.status = "pass";
          resultEl.textContent = JSON.stringify({ ...result, uiBindings }, null, 2);
        } catch (error) {
          resultEl.dataset.status = "fail";
          resultEl.textContent = JSON.stringify({ error: String(error?.message || error) }, null, 2);
        }
      }

      window.runModularSelfTest = runSelfTest;
      maybeAutorunSelfTest();
    </script>
  </body>
</html>
