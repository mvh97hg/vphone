<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>VPhone</title>
    <meta name="description" content="VPhone browser SIP phone widget">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="https://dtd6jl0d42sve.cloudfront.net/lib/Normalize/normalize-v8.0.1.css">
    <link rel="stylesheet preload prefetch" as="style" href="https://dtd6jl0d42sve.cloudfront.net/lib/fonts/font_roboto/roboto.css">
    <link rel="stylesheet preload prefetch" as="style" href="https://dtd6jl0d42sve.cloudfront.net/lib/fonts/font_awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="./styles/phone-ui.css">
  </head>
  <body class="phoneStandaloneApp">
    <div id="Phone"></div>
    <script type="module">
      import { createPhoneWidget } from "./phone-widget.js";

      function parseEmbedConfigFromLocation() {
        let merged = {};
        try {
          const pairs = [];
          const hash = (window.location.hash || "").replace(/^#/, "");
          const query = (window.location.search || "").replace(/^\?/, "");
          if (hash) pairs.push(...hash.split("&"));
          if (query) pairs.push(...query.split("&"));
          const configPair = pairs.find((part) => part.indexOf("bpConfig=") === 0);
          if (configPair) merged = JSON.parse(decodeURIComponent(configPair.substring(9)));
        } catch (err) {
          console.warn("Invalid bpConfig payload", err);
        }

        if (window.__VPhoneEmbedConfig && typeof window.__VPhoneEmbedConfig === "object") {
          merged = { ...merged, ...window.__VPhoneEmbedConfig };
        }
        if (merged.phone && typeof merged.phone === "object") {
          merged = { ...merged.phone, ...merged };
        }
        if (merged.sip && typeof merged.sip === "object") {
          const sip = merged.sip;
          if (sip.wssServer !== undefined) merged.wssServer = sip.wssServer;
          if (sip.WebSocketPort !== undefined) merged.WebSocketPort = sip.WebSocketPort;
          if (sip.webSocketPort !== undefined) merged.WebSocketPort = sip.webSocketPort;
          if (sip.ServerPath !== undefined) merged.ServerPath = sip.ServerPath;
          if (sip.serverPath !== undefined) merged.ServerPath = sip.serverPath;
          if (sip.SipDomain !== undefined) merged.SipDomain = sip.SipDomain;
          if (sip.sipDomain !== undefined) merged.SipDomain = sip.sipDomain;
          if (sip.SipUsername !== undefined) merged.SipUsername = sip.SipUsername;
          if (sip.username !== undefined) merged.SipUsername = sip.username;
          if (sip.SipPassword !== undefined) merged.SipPassword = sip.SipPassword;
          if (sip.password !== undefined) merged.SipPassword = sip.password;
          if (sip.sipPassword !== undefined) merged.SipPassword = sip.sipPassword;
        }
        return merged;
      }

      const config = {
        loadAlternateLang: false,
        Language: "vi",
        AppMode: "auto",
        ...parseEmbedConfigFromLocation()
      };
      window.__VPhoneWidget = createPhoneWidget({
        root: document.getElementById("Phone"),
        config
      });
    </script>
  </body>
</html>
